<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de processamento bancário</title>
  <desc id="description">A aplicação registra uma solicitação, publica o evento no Kafka e um consumidor atualiza o PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a2f"/>
      <stop offset="1" stop-color="#102b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#37d7a5"/>
      <stop offset="1" stop-color="#55b9ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <text x="60" y="49" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Processamento assíncrono de uma movimentação</text>
  <text x="60" y="76" fill="#a9c9e8" font-family="Arial, Helvetica, sans-serif" font-size="15">A API responde rapidamente; o Kafka desacopla o processamento financeiro.</text>

  <path d="M340 149 H500" fill="none" stroke="#55b9ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>
  <path d="M700 149 H860" fill="none" stroke="#37d7a5" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>

  <g transform="translate(60 108)">
    <rect width="280" height="84" rx="14" fill="#123e61" stroke="#55b9ff" stroke-width="2"/>
    <rect x="20" y="22" width="38" height="38" rx="9" fill="#55b9ff"/>
    <path d="M30 41h18M39 32v18" stroke="#08233d" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="37" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Spring Boot API</text>
    <text x="76" y="59" fill="#b8d2e8" font-family="Arial, Helvetica, sans-serif" font-size="14">REST, GraphQL e JWT</text>
  </g>

  <g transform="translate(500 108)">
    <rect width="200" height="84" rx="14" fill="#173b50" stroke="#37d7a5" stroke-width="2"/>
    <path d="M29 31h33v9H29zM29 47h33v9H29z" fill="#37d7a5"/>
    <text x="78" y="37" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Kafka</text>
    <text x="78" y="59" fill="#b8d2e8" font-family="Arial, Helvetica, sans-serif" font-size="14">evento PENDING</text>
  </g>

  <g transform="translate(860 108)">
    <rect width="280" height="84" rx="14" fill="#123e61" stroke="#55b9ff" stroke-width="2"/>
    <ellipse cx="40" cy="29" rx="21" ry="9" fill="#55b9ff"/>
    <path d="M19 29v27c0 5 42 5 42 0V29M19 42c0 5 42 5 42 0" fill="none" stroke="#55b9ff" stroke-width="3"/>
    <text x="78" y="37" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">PostgreSQL</text>
    <text x="78" y="59" fill="#b8d2e8" font-family="Arial, Helvetica, sans-serif" font-size="14">saldo e histórico</text>
  </g>

  <text x="383" y="128" fill="#a9c9e8" font-family="Arial, Helvetica, sans-serif" font-size="13">publica</text>
  <text x="745" y="128" fill="#a9c9e8" font-family="Arial, Helvetica, sans-serif" font-size="13">consome</text>

  <circle r="7" fill="#55b9ff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M340 149 H500"/>
  </circle>
  <circle r="7" fill="#37d7a5">
    <animateMotion begin="1.5s" dur="3s" repeatCount="indefinite" path="M700 149 H860"/>
  </circle>

  <text x="600" y="229" text-anchor="middle" fill="#b8d2e8" font-family="Arial, Helvetica, sans-serif" font-size="14">202 Accepted  →  consumidor transacional  →  COMPLETED ou REJECTED</text>
</svg>
